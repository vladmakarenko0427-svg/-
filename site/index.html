:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 5%,#43347b,#151425 55%,#0b0c17);color:white;display:flex;justify-content:center}.app{width:min(100%,470px);padding:22px 16px 38px;text-align:center}h1{font-size:25px;margin:4px 0 5px}.subtitle{color:#bdb6df;font-size:13px}.counter{margin:24px 0 2px;font-size:43px;font-weight:900;font-variant-numeric:tabular-nums}.counter-label{font-size:13px;color:#c3b6ee}.level{margin:14px auto 19px;max-width:350px}.level-info{display:flex;justify-content:space-between;font-size:13px;color:#d6c8ff}.bar{height:10px;background:#35304c;border-radius:20px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:linear-gradient(90deg,#9a69ff,#ff9fda);transition:width .2s}.tap-wrap{position:relative;width:250px;height:250px;margin:10px auto 18px}.glow{position:absolute;inset:4px;border-radius:50%;background:#ae72ff;filter:blur(26px);opacity:.42}.tap{position:relative;cursor:pointer;width:100%;height:100%;padding:9px;border-radius:50%;border:5px solid #b898ff;background:linear-gradient(145deg,#fff,#b49af5);box-shadow:0 13px 0 #503786,0 19px 35px #080711;transition:transform .08s;touch-action:manipulation;user-select:none}.tap:active{transform:translateY(7px) scale(.96);box-shadow:0 6px 0 #503786}.tap img{width:100%;height:100%;object-fit:cover;object-position:center 26%;border-radius:50%;pointer-events:none}.hint{font-size:14px;color:#d1c6f1;margin:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{background:#ffffff12;border:1px solid #ffffff1b;border-radius:16px;padding:13px}.stat strong{display:block;font-size:20px}.stat small{color:#c8bddf}.section{font-size:19px;text-align:left;margin:26px 0 12px}.upgrade{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin:9px 0;border-radius:17px;border:1px solid #7c65b650;background:#ffffff12;color:#fff;text-align:left;cursor:pointer}.upgrade:disabled{opacity:.55;cursor:not-allowed}.emoji{font-size:29px;width:36px}.detail{flex:1}.detail strong{display:block;font-size:15px}.detail small{display:block;color:#c7bde0;font-size:12px;margin-top:3px}.price{font-size:13px;font-weight:700;color:#e8d2ff}.footer{font-size:11px;color:#aaa2bf;margin:25px 0 0}.float{position:fixed;pointer-events:none;font-size:24px;font-weight:900;color:#fff;text-shadow:0 3px 10px #9b61ff;animation:fly .85s ease-out forwards;z-index:9}@keyframes fly{to{transform:translateY(-95px);opacity:0}}.actions{display:flex;gap:8px;justify-content:center;margin-top:20px}.actions button{border:1px solid #ffffff36;background:#ffffff14;color:#e5dff5;border-radius:12px;padding:9px 13px;cursor:pointer;font-size:12px}

const KEY='yuri-leonidovich-clicker-v1';const defs=[{name:'Волшебный мел',emoji:'🖍️',desc:'+1 за нажатие',base:20,mult:1.55,tap:1,sec:0},{name:'Классный журнал',emoji:'📘',desc:'+5 за нажатие',base:130,mult:1.65,tap:5,sec:0},{name:'Педсовет',emoji:'👨‍🏫',desc:'+2 очка в секунду',base:250,mult:1.7,tap:0,sec:2},{name:'Золотая указка',emoji:'✨',desc:'+25 за нажатие',base:1500,mult:1.8,tap:25,sec:0},{name:'Директорский кабинет',emoji:'🏫',desc:'+20 очков в секунду',base:3200,mult:1.8,tap:0,sec:20},{name:'Легенда образования',emoji:'🏆',desc:'+100 за нажатие',base:12000,mult:1.9,tap:100,sec:0}];let state={score:0,total:0,counts:defs.map(()=>0)};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Number.isFinite(saved.score)&&Number.isFinite(saved.total)&&Array.isArray(saved.counts)&&saved.counts.length===defs.length){state={score:Math.max(0,saved.score),total:Math.max(0,saved.total),counts:saved.counts.map(x=>Number.isInteger(x)&&x>=0?x:0)}}}catch{}const $=id=>document.getElementById(id);const fmt=n=>Math.floor(n).toLocaleString('ru-RU');const gain=()=>1+defs.reduce((s,d,i)=>s+d.tap*state.counts[i],0);const passive=()=>defs.reduce((s,d,i)=>s+d.sec*state.counts[i],0);const price=i=>Math.ceil(defs[i].base*Math.pow(defs[i].mult,state.counts[i]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function render(){const lv=Math.floor(Math.sqrt(state.total/100))+1;const start=100*(lv-1)**2,end=100*lv**2;const within=state.total-start;$('score').textContent=fmt(state.score);$('level').textContent='Уровень '+lv;$('progress').textContent=fmt(within)+' / '+fmt(end-start);$('fill').style.width=Math.min(100,100*within/(end-start))+'%';$('perTap').textContent='+'+fmt(gain());$('perSec').textContent=fmt(passive());defs.forEach((d,i)=>{const b=$('up'+i);b.disabled=state.score<price(i);b.querySelector('.price').textContent=fmt(price(i))+' ⭐';b.querySelector('.owned').textContent='Куплено: '+state.counts[i]})}const list=$('upgrades');defs.forEach((d,i)=>{const b=document.createElement('button');b.className='upgrade';b.id='up'+i;b.innerHTML='<span class="emoji">'+d.emoji+'</span><span class="detail"><strong>'+d.name+'</strong><small>'+d.desc+' · <span class="owned"></span></small></span><span class="price"></span>';b.onclick=()=>{const cost=price(i);if(state.score<cost)return;state.score-=cost;state.counts[i]++;save();render()};list.append(b)});const messages=['Пятёрка за старание!','Уважение растёт!','Отличный ответ!','Звонок для учителя!','Педагогический успех!'];let taps=0;$('tap').addEventListener('click',e=>{const amount=gain();state.score+=amount;state.total+=amount;taps++;if(taps%20===0)$('hint').textContent=messages[Math.floor(Math.random()*messages.length)];const f=document.createElement('span');f.className='float';f.textContent='+'+fmt(amount);f.style.left=(e.clientX-12)+'px';f.style.top=(e.clientY-18)+'px';document.body.append(f);setTimeout(()=>f.remove(),850);save();render()});let last=Date.now();setInterval(()=>{const now=Date.now();const delta=Math.min(5,(now-last)/1000);last=now;const added=passive()*delta;if(added){state.score+=added;state.total+=added;render()}},250);setInterval(save,2500);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();last=Date.now()});$('save').onclick=()=>{save();$('hint').textContent='Прогресс сохранён!'};$('reset').onclick=()=>{if(confirm('Точно удалить весь прогресс?')){state={score:0,total:0,counts:defs.map(()=>0)};save();render();$('hint').textContent='Прогресс сброшен'}};render();
</script></body></html>
